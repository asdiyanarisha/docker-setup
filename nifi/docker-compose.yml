# ============================================================
# Apache NiFi - Docker Compose (Single Node)
# ============================================================
# Cara pakai:
#   mkdir -p nifi_data/{input,output,drivers}
#   docker-compose up -d
#
# Akses UI:
#   https://localhost:8443/nifi
#   Username : admin
#   Password : adminpassword123 (min 12 karakter)
#
# Hentikan:
#   docker-compose down
#
# Hentikan + hapus data:
#   docker-compose down -v
# ============================================================

services:

  nifi:
    image: apache/nifi:latest
    container_name: nifi
    hostname: nifi
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      # === Autentikasi (wajib, min 12 karakter) ===
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: adminpassword123

      # === JVM Memory (sesuaikan dengan RAM server) ===
      NIFI_JVM_HEAP_INIT: 2g
      NIFI_JVM_HEAP_MAX: 4g

      # === Konfigurasi Web ===
      NIFI_WEB_HTTPS_PORT: 8443
      NIFI_WEB_PROXY_HOST: localhost:8443

      # === Timezone ===
      TZ: Asia/Jakarta

    volumes:
      - nifi_database_repository:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile_repository:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content_repository:/opt/nifi/nifi-current/content_repository
      - nifi_provenance_repository:/opt/nifi/nifi-current/provenance_repository
      - nifi_state:/opt/nifi/nifi-current/state
      - nifi_logs:/opt/nifi/nifi-current/logs
      - nifi_conf:/opt/nifi/nifi-current/conf
      - ./nifi_data/input:/opt/nifi/nifi-current/input
      - ./nifi_data/output:/opt/nifi/nifi-current/output
      - ./nifi_data/drivers:/opt/nifi/nifi-current/drivers

    networks:
      - nifi-network

    deploy:
      resources:
        limits:
          memory: 6g
          cpus: '2.0'
        reservations:
          memory: 2g

    healthcheck:
      test: ["CMD", "curl", "-kf", "https://localhost:8443/nifi-api/system-diagnostics"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s

volumes:
  nifi_database_repository:
  nifi_flowfile_repository:
  nifi_content_repository:
  nifi_provenance_repository:
  nifi_state:
  nifi_logs:
  nifi_conf:

networks:
  nifi-network:
    driver: bridge
